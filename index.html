<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Binary Vidya website URL update. Visit the new Binary Vidya website.">
  <title>Binary Vidya | New Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-glow glow-one"></div>
  <div class="background-glow glow-two"></div>

  <main class="page">
    <section class="card">
      <div class="logo-wrap">
        <img src="logo.png" alt="Binary Vidya Logo" class="logo">
      </div>

      <div class="badge">WEBSITE UPDATE</div>

      <h1>Our Website URL Has Changed</h1>

      <p class="subtitle">
        Welcome to Binary Vidya. Our official website has moved to a new URL.
      </p>

      <div class="url-box">
        <span class="url-label">NEW WEBSITE</span>
        <a href="https://binaryvidya.com/" target="_blank" rel="noopener noreferrer">
          https://binaryvidya.com/
        </a>
      </div>

      <a class="visit-btn" href="https://binaryvidya.com/" target="_blank" rel="noopener noreferrer">
        Visit New Website
        <span aria-hidden="true">→</span>
      </a>

      <p class="note">
        Please update your bookmarks and use the new website for future visits.
      </p>
    </section>

    <footer>
      © <span id="year"></span> Binary Vidya. All rights reserved.
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
